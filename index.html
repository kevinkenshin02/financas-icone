<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="application-name" content="Finanças">
<meta name="theme-color" content="#1c1830">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="financas.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #1c1830; color: #f3f0fa;
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; text-align: center; }
  main { max-width: 360px; display: grid; gap: 18px; justify-items: center; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 16px 40px rgba(140, 90, 255, .35); }
  h1 { font-size: 22px; }
  p { color: #a59dbf; font-size: 15px; line-height: 1.5; }
  a.btn { display: inline-block; padding: 14px 26px; border-radius: 14px; color: #fff; font-weight: 600; text-decoration: none;
    background: linear-gradient(135deg, #8b7cf6, #e45bd0); }
  ol { text-align: left; color: #a59dbf; font-size: 14px; line-height: 1.6; padding-left: 20px; }
  b { color: #f3f0fa; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>Minhas Finanças</h1>
  <div id="instrucoes">
    <ol>
      <li>Toque em <b>Compartilhar</b> (o quadrado com a seta para cima).</li>
      <li>Escolha <b>Adicionar à Tela de Início</b> e confirme.</li>
      <li>Abra pelo ícone novo: ele leva direto para o app.</li>
    </ol>
  </div>
  <a class="btn" id="abrir" href="#">Abrir agora</a>
</main>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbxucTPj4rBw_V9FguWnXg_b5O5yynIzfZXsQ62DHuUV77ZU-Kd9PTAHmeUhpbsNtcxMLA/exec';
  document.getElementById('abrir').href = APP;
  // Aberto pelo ícone da tela de início (o endereço salvo tem ?abrir=1): vai direto para o app.
  if (/[?&]abrir=1/.test(location.search)) {
    document.getElementById('instrucoes').style.display = 'none';
    location.replace(APP);
  } else {
    // Troca o endereço sem recarregar, para o "Adicionar à Tela de Início" salvar já com ?abrir=1.
    history.replaceState(null, '', location.pathname + '?abrir=1');
  }
</script>
</body>
</html>
